<rect x="235" y="140" width="145" height="90" rx="12" fill="#E0F2FE"/>
<text x="307.5" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Split</text>
<text x="307.5" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">right-sized chunks</text>
