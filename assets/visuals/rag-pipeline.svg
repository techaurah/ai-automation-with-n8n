<rect x="430" y="140" width="145" height="90" rx="12" fill="#E0F2FE"/>
<text x="502.5" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Embed</text>
<text x="502.5" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">meaning as numbers</text>
<line x1="579" y1="185" x2="621" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="625" y="140" width="145" height="90" rx="12" fill="#E0F2FE"/>
<text x="697.5" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Store</text>
<text x="697.5" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">the vector store</text>
<line x1="774" y1="185" x2="816" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="820" y="140" width="145" height="90" rx="12" fill="#E0F2FE"/>
<text x="892.5" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Retrieve</text>
<text x="892.5" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">top chunks</text>
<line x1="969" y1="185" x2="1011" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1015" y="140" width="145" height="90" rx="12" fill="#0B1F4A"/>
<text x="1087.5" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Answer</text>
<text x="1087.5" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">with citations</text>
<text x="40" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">If retrieval returns nothing relevant, the correct answer is an abstention.</text>
