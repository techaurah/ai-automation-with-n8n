<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<rect width="1200" height="300" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker></defs>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">Five doors into a workflow</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Whatever the door, normalise into one house shape immediately after it.</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="40" y="140" width="192" height="90" rx="12" fill="#E0F2FE"/>
<text x="136.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Manual</text>
<text x="136.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">you click</text>
<line x1="236" y1="185" x2="268" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="272" y="140" width="192" height="90" rx="12" fill="#E0F2FE"/>
<text x="368.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Schedule</text>
<text x="368.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">the clock</text>
<line x1="468" y1="185" x2="500" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="504" y="140" width="192" height="90" rx="12" fill="#E0F2FE"/>
<text x="600.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Webhook</text>
<text x="600.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">a system calls</text>
<line x1="700" y1="185" x2="732" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="736" y="140" width="192" height="90" rx="12" fill="#E0F2FE"/>
<text x="832.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Form</text>
<text x="832.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">a person submits</text>
<line x1="932" y1="185" x2="964" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="968" y="140" width="192" height="90" rx="12" fill="#E0F2FE"/>
<text x="1064.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Chat</text>
<text x="1064.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">a conversation starts</text>
<text x="40" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Downstream nodes should never learn which door the data came through.</text>
</svg>