<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect width="1200" height="560" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker></defs>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">The production layers around a workflow</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Each layer is a module of this course; none is optional for long.</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="240" y="130" width="720" height="80" rx="12" fill="#E0F2FE"/>
<text x="600.0" y="166.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Publish</text>
<text x="600.0" y="190.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">draft to published, exports in git, rollbacks ready</text>
<rect x="240" y="230" width="720" height="80" rx="12" fill="#E0F2FE"/>
<text x="600.0" y="266.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Hosting</text>
<text x="600.0" y="290.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">Postgres, pinned versions, backups rehearsed</text>
<rect x="240" y="330" width="720" height="80" rx="12" fill="#FEF3C7"/>
<text x="600.0" y="366.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Security</text>
<text x="600.0" y="390.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7C5A03">credentials, hardened defaults, approvals</text>
<rect x="240" y="430" width="720" height="80" rx="12" fill="#E0F2FE"/>
<text x="600.0" y="466.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Monitoring</text>
<text x="600.0" y="490.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">four numbers, daily digest, weekly trend</text>
<text x="40" y="545" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">A workflow is production when all four layers hold, not when it merely runs.</text>
</svg>