<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<rect width="1200" height="470" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker></defs>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">Anatomy of an AI agent in n8n</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">One root node, its capabilities supplied by sub-nodes underneath.</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="430" y="130" width="340" height="95" rx="12" fill="#0B1F4A"/>
<text x="600.0" y="173.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">AI Agent</text>
<text x="600.0" y="197.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">the root node: decide, act, observe</text>
<rect x="60" y="300" width="320" height="95" rx="12" fill="#E0F2FE"/>
<text x="220.0" y="343.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Chat Model</text>
<text x="220.0" y="367.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">required: the reasoning engine</text>
<rect x="440" y="300" width="320" height="95" rx="12" fill="#E0F2FE"/>
<text x="600.0" y="343.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Tools</text>
<text x="600.0" y="367.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">required: what the agent can do</text>
<rect x="820" y="300" width="320" height="95" rx="12" fill="#E0F2FE"/>
<text x="980.0" y="343.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Memory</text>
<text x="980.0" y="367.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">optional: the conversation so far</text>
<line x1="220" y1="295" x2="520" y2="232" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<line x1="600" y1="295" x2="600" y2="232" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<line x1="980" y1="295" x2="680" y2="232" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<text x="40" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Sub-nodes connect by type: ai_languageModel, ai_tool, ai_memory. Swap one without rebuilding the workflow.</text>
</svg>