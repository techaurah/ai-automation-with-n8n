<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<rect width="1200" height="300" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker></defs>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">Anatomy of a workflow: read it like a sentence</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">A trigger starts it, nodes do the work, connections are the verbs.</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="40" y="140" width="242" height="90" rx="12" fill="#0B1F4A"/>
<text x="161.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Trigger</text>
<text x="161.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">when it runs</text>
<line x1="286" y1="185" x2="328" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="332" y="140" width="242" height="90" rx="12" fill="#E0F2FE"/>
<text x="453.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Nodes</text>
<text x="453.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">one job each</text>
<line x1="578" y1="185" x2="620" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="624" y="140" width="242" height="90" rx="12" fill="#E0F2FE"/>
<text x="745.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Connections</text>
<text x="745.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">data flows</text>
<line x1="870" y1="185" x2="912" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="916" y="140" width="242" height="90" rx="12" fill="#0B1F4A"/>
<text x="1037.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Execution</text>
<text x="1037.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">the recorded run</text>
<text x="40" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">If you cannot say the workflow's sentence out loud, you do not understand it yet.</text>
</svg>